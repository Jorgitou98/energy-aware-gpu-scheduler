name: Saved-result reproduction
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version == '3.10'
        run: python -m pip install -r requirements.txt
      - if: matrix.python-version == '3.12'
        run: python -m pip install -r requirements/reproduction-py312.txt
      - run: python reproduce.py verify
      - run: python reproduce.py audit
      - run: python -m unittest discover -s tests -v
      - run: python reproduce.py tables
      - run: python reproduce.py figures
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            build/audit/*summary.json
            build/audit/reproducibility.json
            build/tables/
            build/figures/
